name: Deploy Makhana Store

"on":
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY_B64 }}" | base64 --decode > /tmp/makhana-key.pem
          chmod 600 /tmp/makhana-key.pem

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key_path: /tmp/makhana-key.pem
          script: |
            cd ~/makhana-store
            git pull origin main
            docker compose up -d --build